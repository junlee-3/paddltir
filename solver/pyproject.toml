[project]
name = "paddltir-solver"
version = "0.1.0"
description = "Paddltir lexicographic lineup optimiser (HiGHS) and API"
requires-python = ">=3.12"
dependencies = [
  "highspy>=1.8.0",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-timeout>=2.3", "ruff>=0.6", "uvicorn>=0.30"]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends() as a call in an argument default is the documented FastAPI DI
# idiom, not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Test fixture factories default to frozen value objects (GenderRule(...), Boat(...));
# same non-bug shape as the FastAPI Depends() case above, but ruff doesn't know that.
"tests/*" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paddltir_solver"]
